scenarios:
  fairness:
    dev:
      worker_counts: [4, 8]
      whale_deliveries: 200
      small_count: 10
      small_deliveries: 20
      submit_interval: 2ms
      request_timeout: 1500ms
      min_batch_hint: 8
      retry_max_attempts: 10
      retry_base_delay: 25ms
      retry_cap_delay: 2s
      fairness_ratio_limit: 1.05
      breaker_failure_threshold: 0
    stress:
      worker_counts: [16, 32, 64]
      whale_deliveries: 5000
      small_count: 20000
      small_deliveries: 2
      submit_interval: 1ms
      request_timeout: 1500ms
      min_batch_hint: 8
      retry_max_attempts: 10
      retry_base_delay: 25ms
      retry_cap_delay: 2s
      fairness_ratio_limit: 1.05
      breaker_failure_threshold: 0
  scalability:
    dev:
      replica_counts: [1, 2]
      sparse_customers: 1000
      sparse_events_per_customer: 1
      dense_customers: 10
      dense_deliveries_per_customer: 100
      request_timeout: 1500ms
      min_batch_hint: 8
      multi_pick_count: 32
      breaker_failure_threshold: 0
      retry_max_attempts: 3
      retry_base_delay: 25ms
      retry_cap_delay: 2s
      fairness_ratio_limit: 1.05
    stress:
      replica_counts: [1, 2, 4]
      sparse_customers: 20000
      sparse_events_per_customer: 1
      dense_customers: 100
      dense_deliveries_per_customer: 1000
      request_timeout: 1500ms
      min_batch_hint: 8
      multi_pick_count: 32
      breaker_failure_threshold: 0
      retry_max_attempts: 3
      retry_base_delay: 25ms
      retry_cap_delay: 2s
      fairness_ratio_limit: 1.05
  reliability:
    dev:
      worker_count: 8
      customer_count: 5
      events_per_customer: 20
      submit_interval: 5ms
      outage_delay: 1s
      outage_duration: 5s
      request_timeout: 250ms
      discovery_interval: 50ms
      discovery_empty_backoff: 50ms
      discovery_error_backoff: 50ms
      discovery_max_backoff: 250ms
      discovery_limit: 100
      breaker_failure_threshold: 2
      breaker_initial_cooldown: 2s
      breaker_max_cooldown: 2s
    stress:
      worker_count: 32
      customer_count: 10
      events_per_customer: 100
      submit_interval: 20ms
      outage_delay: 5s
      outage_duration: 30s
      request_timeout: 250ms
      discovery_interval: 50ms
      discovery_empty_backoff: 50ms
      discovery_error_backoff: 50ms
      discovery_max_backoff: 250ms
      discovery_limit: 100
      breaker_failure_threshold: 2
      breaker_initial_cooldown: 15s
      breaker_max_cooldown: 15s
  partner_protection:
    dev:
      worker_count: 8
      customer_count: 5
      deliveries_per_customer: 100
      request_timeout: 250ms
      discovery_interval: 50ms
      discovery_empty_backoff: 50ms
      discovery_error_backoff: 50ms
      discovery_max_backoff: 250ms
      discovery_limit: 100
      breaker_failure_threshold: 2
      breaker_initial_cooldown: 2s
      breaker_max_cooldown: 2s
    stress:
      worker_count: 32
      customer_count: 10
      deliveries_per_customer: 1000
      request_timeout: 250ms
      discovery_interval: 50ms
      discovery_empty_backoff: 50ms
      discovery_error_backoff: 50ms
      discovery_max_backoff: 250ms
      discovery_limit: 100
      breaker_failure_threshold: 2
      breaker_initial_cooldown: 15s
      breaker_max_cooldown: 15s
