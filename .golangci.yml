run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - gocritic
    - gosec
    - nolintlint

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: ["disableStutteringCheck"]
      - name: package-comments
      - name: var-naming
  gosec:
    excludes:
      - G404 # math/rand acceptable for jitter

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
