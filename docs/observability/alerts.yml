groups:
  - name: webhook-notifier
    rules:
      - alert: WebhookDeliveryP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(webhook_delivery_latency_seconds_bucket[5m]))) > 300
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Webhook delivery p95 latency is above 300 seconds.

      - alert: WebhookErrorRateHigh
        expr: rate(webhook_deliveries_total{status="dead"}[5m]) / rate(webhook_deliveries_total[5m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: More than 5 percent of webhook deliveries are dead.

      - alert: WebhookQueueDepthGrowing
        expr: deriv(sum(webhook_pending_count)[15m:]) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: Webhook pending queue depth is growing.

      - alert: WebhookCustomerStarvation
        expr: histogram_quantile(0.95, sum by (customer_class, le) (rate(webhook_delivery_latency_seconds_bucket{customer_class="small"}[5m]))) > 5 * histogram_quantile(0.50, sum by (le) (rate(webhook_delivery_latency_seconds_bucket[5m])))
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: Small-customer p95 latency is more than 5x the median across all customers.

      - alert: WebhookHostSemaphoreSaturated
        expr: histogram_quantile(0.95, sum by (host, le) (rate(webhook_host_semaphore_wait_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: A partner host semaphore is saturated.
