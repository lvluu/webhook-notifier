global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notifier
    static_configs:
      - targets:
          - notifier:9090
        labels:
          service: notifier

  - job_name: webhook-receiver
    static_configs:
      - targets:
          - webhook-receiver:9091
        labels:
          service: webhook-receiver
