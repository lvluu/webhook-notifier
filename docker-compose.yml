services:
  postgres:
    image: postgres:17-alpine
    container_name: webhook-notifier-pg
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
