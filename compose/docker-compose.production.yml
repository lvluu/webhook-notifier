# Production-representative compose override.
#
# Layer this on top of docker-compose.yml to close fidelity gaps:
#   - Durable Postgres with synchronous_commit=on and prod-sized buffers.
#   - Container CPU/memory resource limits.
#   - Multi-host partner receivers (fast, flaky, slow, dead).
#   - TLS-enabled receiver for realistic transport.
#   - Realistic delivery-history retention (24h window).
#
# Usage:
#   docker compose -f compose/docker-compose.yml -f compose/docker-compose.production.yml --profile production up -d
#   just stack-production

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=on
      - -c
      - wal_level=minimal
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - password_encryption=md5
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - statement_timeout=30s
      - -c
      - transaction_timeout=2min
      - -c
      - idle_in_transaction_session_timeout=5min
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
        reservations:
          cpus: "1"
          memory: 1g

  pgbouncer:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  notifier:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m

  caddy:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  webhook-receiver:
    profiles:
      - ""
      - observe
      - chaos
      - retention
      - production

  # Multi-host partner receivers — each receives webhooks from different hostnames
  # to exercise host-limiter and breaker isolation in a single-compose setup.
  webhook-receiver-fast:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 1ms
      - -latency-max
      - 5ms
      - -failure-rate
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-flaky:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 50ms
      - -failure-rate
      - "0.3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-slow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 50ms
      - -latency-max
      - 200ms
      - -failure-rate
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-dead:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -failure-rate
      - "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    profiles:
      - production

  # TLS-enabled receiver.
  webhook-receiver-tls:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8443
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 15ms
      - -failure-rate
      - "0"
      - -tls-cert
      - /certs/server.crt
      - -tls-key
      - /certs/server.key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    depends_on:
      certs-init:
        condition: service_completed_successfully
    profiles:
      - production

  # One-shot init container that generates self-signed certs into the shared volume.
  certs-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl &&
        mkdir -p /certs &&
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /certs/server.key \
          -out /certs/server.crt \
          -days 365 \
          -subj "/CN=webhook-receiver-tls" \
          -addext "subjectAltName=DNS:webhook-receiver-tls,DNS:localhost" &&
        chmod 644 /certs/server.crt &&
        chmod 600 /certs/server.key &&
        echo "TLS certs generated"
    volumes:
      - certs:/certs
    profiles:
      - production

  delivery-history-retention:
    command:
      - sh
      - -c
      - |
        while true; do
          delivery-history-retention \
            -db postgres://notifier:notifier@pgbouncer:6432/notifier?sslmode=disable \
            -retention 24h \
            -batch-size 500 \
            -enrichment deferred;
          sleep 300;
        done
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  chaos-whales:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  chaos-small:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m

  prometheus:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 256m

  grafana:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 256m

volumes:
  certs:
