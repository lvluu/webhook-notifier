apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: notifier
    user: notifier
    secureJsonData:
      password: notifier
    jsonData:
      database: notifier
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
