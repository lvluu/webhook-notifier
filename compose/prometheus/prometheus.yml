global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notifier
    dns_sd_configs:
      - names:
          - notifier
        type: A
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - target_label: service
        replacement: notifier

  - job_name: webhook-receiver
    static_configs:
      - targets:
          - webhook-receiver:9091
        labels:
          service: webhook-receiver
