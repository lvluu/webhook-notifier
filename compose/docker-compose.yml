x-chaos-common: &chaos-common
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    - notifier
    - webhook-receiver
  profiles:
    - chaos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./migrations/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off
      - -c
      - password_encryption=md5
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: notifier
      DB_PASSWORD: notifier
      DB_NAME: notifier
      POOL_MODE: session
      DEFAULT_POOL_SIZE: "12"
      MAX_CLIENT_CONN: "100"
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy

  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - notifier
      - -db
      - postgres://notifier:notifier@pgbouncer:6432/notifier?sslmode=disable
      - -addr
      - :8080
      - -metrics-addr
      - :9090
      - -workers
      - "8"
      - -min-batch
      - "4"
      - -concurrency
      - "4"
      - -discovery-interval
      - 10s
      - -empty-claim-backoff
      - 20ms
      - -pending-sample-interval
      - 5s
      - -enable-pg-notify-wakeups
      - "true"
      - -pg-notify-channel
      - webhook_customer_ready
      - -claim-query-mode
      - split
      - -max-conns
      - "12"
    depends_on:
      pgbouncer:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - notifier

  webhook-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 15ms
    ports:
      - "8081:8080"
      - "9092:9091"

  delivery-history-retention:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - |
        while true; do
          delivery-history-retention \
            -db postgres://notifier:notifier@pgbouncer:6432/notifier?sslmode=disable \
            -retention 1m \
            -batch-size 300 \
            -enrichment deferred;
          sleep 60;
        done
    depends_on:
      pgbouncer:
        condition: service_started
    profiles:
      - retention
      - chaos

  chaos-whales:
    <<: *chaos-common
    command:
      - chaos
      - -notifier
      - http://notifier:8080
      - -receiver
      - http://webhook-receiver:8080
      - -customer-base
      - whale
      - -customers
      - "50"
      - -class
      - "1"
      - -rate
      - "250"
      - -burst
      - "1000"

  chaos-small:
    <<: *chaos-common
    command:
      - chaos
      - -notifier
      - http://notifier:8080
      - -receiver
      - http://webhook-receiver:8080
      - -customer-base
      - small
      - -customers
      - "5000"
      - -class
      - "1"
      - -rate
      - "50"
      - -burst
      - "200"

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observe
    ports:
      - "9091:9090"
    volumes:
      - ./compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observe
    ports:
      - "3000:3000"
    volumes:
      - ./compose/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./compose/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
