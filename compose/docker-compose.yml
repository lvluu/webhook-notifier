x-notifier-common: &notifier-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9090/ready"]
    interval: 2s
    timeout: 2s
    retries: 15
  depends_on:
    pgbouncer:
      condition: service_started
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1g
      reservations:
        cpus: "0.5"
        memory: 256m

x-chaos-common: &chaos-common
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    notifier:
      condition: service_healthy
    webhook-receiver:
      condition: service_started
  profiles:
    - chaos

services:
  postgres:
    image: postgres:17-alpine
    shm_size: 256m
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./migrations/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=on
      - -c
      - wal_level=minimal
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - password_encryption=md5
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - statement_timeout=30s
      - -c
      - transaction_timeout=2min
      - -c
      - idle_in_transaction_session_timeout=5min
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8g
        reservations:
          cpus: "2"
          memory: 2g

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: notifier
      DB_PASSWORD: notifier
      DB_NAME: notifier
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "120"
      MAX_PREPARED_STATEMENTS: "200"
      MAX_CLIENT_CONN: "600"
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  notifier:
    <<: *notifier-common
    command:
      - notifier
      - -db
      - postgres://notifier:notifier@pgbouncer:6432/notifier?sslmode=disable
      - -addr
      - :8080
      - -metrics-addr
      - :9090
      - -workers
      - "16"
      - -min-batch
      - "32"
      - -multi-pick
      - "8"
      - -host-cap
      - "1000"
      - -discovery-interval
      - 10s
      - -empty-claim-backoff
      - 20ms
      - -pending-sample-interval
      - 5s
      - -enable-pg-notify-wakeups=true
      - -pg-notify-db
      - postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
      - -pg-notify-channel
      - webhook_customer_ready
      - -max-conns
      - "60"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - notifier
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  webhook-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 15ms
      - -failure-rate
      - "0.02"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "8081:8080"
      - "9092:9091"

  webhook-receiver-fast:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 1ms
      - -latency-max
      - 5ms
      - -failure-rate
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-flaky:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 50ms
      - -failure-rate
      - "0.3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-slow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -latency-min
      - 50ms
      - -latency-max
      - 200ms
      - -failure-rate
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - production

  webhook-receiver-dead:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8080
      - -metrics-addr
      - :9091
      - -failure-rate
      - "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    profiles:
      - production

  webhook-receiver-tls:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - webhook-receiver
      - -addr
      - :8443
      - -metrics-addr
      - :9091
      - -latency-min
      - 5ms
      - -latency-max
      - 15ms
      - -failure-rate
      - "0"
      - -tls-cert
      - /certs/server.crt
      - -tls-key
      - /certs/server.key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/metrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    depends_on:
      certs-init:
        condition: service_completed_successfully
    profiles:
      - production

  certs-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl &&
        mkdir -p /certs &&
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /certs/server.key \
          -out /certs/server.crt \
          -days 365 \
          -subj "/CN=webhook-receiver-tls" \
          -addext "subjectAltName=DNS:webhook-receiver-tls,DNS:localhost" &&
        chmod 644 /certs/server.crt &&
        chmod 600 /certs/server.key &&
        echo "TLS certs generated"
    volumes:
      - certs:/certs
    profiles:
      - production

  delivery-history-retention:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - |
        while true; do
          delivery-history-retention \
            -db postgres://notifier:notifier@pgbouncer:6432/notifier?sslmode=disable \
            -retention 24h \
            -batch-size 500 \
            -enrichment deferred;
          sleep 300;
        done
    depends_on:
      pgbouncer:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    profiles:
      - retention
      - chaos

  chaos-whales:
    <<: *chaos-common
    command:
      - chaos
      - -notifier
      - http://notifier:8080
      - -receiver
      - http://webhook-receiver:8080
      - -customer-base
      - whale
      - -customers
      - "5"
      - -class
      - "3"
      - -rate
      - "200"
      - -burst
      - "300"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  chaos-small:
    <<: *chaos-common
    command:
      - chaos
      - -notifier
      - http://notifier:8080
      - -receiver
      - http://webhook-receiver:8080
      - -customer-base
      - small
      - -customers
      - "5000"
      - -class
      - "1"
      - -rate
      - "250"
      - -burst
      - "300"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observe
    ports:
      - "9091:9090"
    volumes:
      - ./compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 256m

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observe
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./compose/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./compose/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 256m

volumes:
  pgdata:
  certs:
